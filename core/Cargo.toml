[workspace]
resolver = "2"
members = [
    "crates/hrms-domain",
    "crates/hrms-calendar",
    "crates/hrms-rules",
    "crates/hrms-policy",
    "crates/hrms-store",
    "crates/hrms-ffi",
    "crates/hrms-conformance",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
